# Local cluster for the demo. Host ports: app 8000, Grafana 3000, Prometheus 9090.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: canary-demo
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 80, hostPort: 8000}     # ingress-nginx (hostPort 80 on the node)
      - {containerPort: 30300, hostPort: 3000}  # Grafana NodePort
      - {containerPort: 30090, hostPort: 9090}  # Prometheus NodePort
