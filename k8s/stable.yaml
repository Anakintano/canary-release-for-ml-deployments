# Stable track: gets all traffic that the canary Ingress does not take.
# Jenkins applies this once (first release) with __IMAGE__ replaced; promotion uses `kubectl set image`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickets-stable
spec:
  replicas: 2
  selector:
    matchLabels: {app: tickets, track: stable}
  template:
    metadata:
      labels: {app: tickets, track: stable}
    spec:
      containers:
        - name: api
          image: __IMAGE__
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: tickets-stable
spec:
  selector: {app: tickets, track: stable}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tickets
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: tickets-stable, port: {number: 80}}
