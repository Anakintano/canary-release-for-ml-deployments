# Canary track: the new version, side by side with stable, receiving 10% of traffic.
# Jenkins applies this with __IMAGE__ replaced. Promote/rollback set the weight to 0 and scale to 0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickets-canary
spec:
  replicas: 1
  selector:
    matchLabels: {app: tickets, track: canary}
  template:
    metadata:
      labels: {app: tickets, track: canary}
    spec:
      containers:
        - name: api
          image: __IMAGE__
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: tickets-canary
spec:
  selector: {app: tickets, track: canary}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tickets-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
    # A request with cookie canary=always always goes to the canary (used by the Selenium smoke test).
    nginx.ingress.kubernetes.io/canary-by-cookie: "canary"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: tickets-canary, port: {number: 80}}
