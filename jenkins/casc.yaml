# Jenkins configuration as code: one admin user and one pipeline job reading the Jenkinsfile from main.
jenkins:
  systemMessage: "Canary release demo"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
jobs:
  - script: |
      pipelineJob('canary-release') {
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${REPO_URL}') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
